    <path d="M 15,40 L 40,40 L 40,75 L 15,75 Z" fill="#005A36"/>
    <path d="M 40,75 L 75,75 L 75,115 L 40,115 Z" fill="#005A36"/>
    <path d="M 75,40 L 115,40 L 115,75 L 75,75 Z" fill="#005A36"/>
    
    <!-- Stylized curved figures in cross -->
    <path d="M 50,25 C 50,25 65,45 65,65 C 65,85 50,105 50,105 C 50,105 85,85 85,65 C 85,45 50,25 50,25 Z" fill="#1B1D1C" />
    <circle cx="68" cy="35" r="7" fill="#1B1D1C"/>
    <circle cx="82" cy="72" r="6" fill="#005A36"/>
  </g>

