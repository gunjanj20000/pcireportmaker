    <text x="126" y="95" font-size="22" font-weight="bold" fill="#1B1D1C" letter-spacing="1">HOSPITALS</text>
    <text x="22" y="132" font-size="16" font-weight="bold" fill="#1B1D1C" letter-spacing="1">TRUSTED HEALTH PARTNER</text>
  </g>
</svg>
