<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A36" />
      <stop offset="50%" stop-color="#004227" />
      <stop offset="100%" stop-color="#002717" />
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>

    <!-- Stent Gold Metal Gradient -->
    <linearGradient id="stent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFF59D" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" filter="url(#card-shadow)"/>
  
  <!-- Subtle Outer Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.15"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#stent-grad)" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.4"/>

  <!-- Center Medical Heart Symbol -->
  <g transform="translate(131, 105) scale(1.0)" filter="url(#glow)">
    <!-- Heart Body -->
    <path d="M 125,45 C 90,-20 0,15 0,105 C 0,175 125,245 125,245 C 125,245 250,175 250,105 C 250,15 160,-20 125,45 Z" fill="url(#heart-grad)"/>

    <!-- Coronary Artery Branch (Gold Stent mesh pattern across heart) -->
    <path d="M 90,80 Q 125,120 150,165" fill="none" stroke="url(#stent-grad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Stent Mesh Grid Details -->
    <path d="M 85,75 L 98,88 M 95,85 L 108,98 M 105,95 L 118,108 M 115,105 L 128,118 M 125,115 L 138,128 M 135,125 L 148,138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 98,75 L 85,88 M 108,85 L 95,98 M 118,95 L 105,108 M 128,105 L 115,118 M 138,115 L 125,128 M 148,125 L 135,138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- ECG Electrocardiogram Pulse Line -->
    <path d="M -25,115 L 45,115 L 60,85 L 75,145 L 95,35 L 115,160 L 135,95 L 150,115 L 275,115" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Label Badge: CKS PCI -->
  <g transform="translate(156, 400)">
    <rect x="0" y="0" width="200" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.95" filter="url(#card-shadow)"/>
    <text x="100" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#005A36" text-anchor="middle" letter-spacing="2">CKS PCI</text>
  </g>
</svg>
